<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="memBg" x1="0" y1="0" x2="600" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="55%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="720" fill="url(#memBg)"/>
  <circle cx="300" cy="270" r="220" fill="url(#candleGlow)"/>

  <rect x="28" y="28" width="544" height="664" rx="24" stroke="#D97706" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="44" y="44" width="512" height="632" rx="18" stroke="#1E3A8A" stroke-opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Catholic Cross -->
  <g transform="translate(300, 235)">
    <rect x="-12" y="-115" width="24" height="225" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <rect x="-78" y="-58" width="156" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="0" cy="-46" r="18" fill="#FDE047" fill-opacity="0.35" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Warm Prayer Candle -->
  <g transform="translate(300, 410)">
    <path d="M0 -36 C10 -18 14 -6 0 4 C-14 -6 -10 -18 0 -36 Z" fill="#F59E0B"/>
    <path d="M0 -24 C5 -14 7 -7 0 0 C-7 -7 -5 -14 0 -24 Z" fill="#FEF08A"/>
    <rect x="-18" y="6" width="36" height="62" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>

  <text x="300" y="540" text-anchor="middle" fill="#1E293B" font-family="'Montserrat', system-ui, sans-serif" font-size="24" font-weight="800">Khung Ảnh Kính Nhớ Ba</text>
  <text x="300" y="575" text-anchor="middle" fill="#475569" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="15">Chép ảnh kỷ niệm của Ba vào:</text>
  <rect x="180" y="596" width="240" height="36" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="300" y="619" text-anchor="middle" fill="#B45309" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14">public/images/ba.jpg</text>
</svg>

